name: static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Parse scripts and manifest
        run: bash tests/static.sh
