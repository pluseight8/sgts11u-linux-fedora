# PipeWire server for GNOME Mutter Devkit in a Fedora PRoot guest.
#
# This is deliberately separate from Fedora's desktop/audio configuration.
# Mutter Devkit needs the native protocol, client-node support and a dummy
# driver for its screen-cast stream; it does not need WirePlumber, PulseAudio,
# ALSA/udev enumeration, RTKit, D-Bus access control or portal integration.
# Keeping those modules out avoids Android/PRoot failures and lowers RSS.

context.properties = {
    core.daemon = true
    core.name = pipewire-0

    support.dbus = false
    link.max-buffers = 16
    context.num-data-loops = 1
    mem.allow-mlock = false
    mem.mlock-all = false
    default.clock.rate = 48000
    default.clock.quantum = 1024
    default.clock.min-quantum = 256
    default.clock.max-quantum = 2048
    log.level = 1
}

context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
    video.convert.* = videoconvert/libspa-videoconvert
}

context.modules = [
    { name = libpipewire-module-protocol-native
        args = {
            sockets = [ { name = "pipewire-0" } ]
        }
    }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access
        args = {
            # PRoot has no systemd/portal access broker. Legacy mode gives
            # local native clients the normal anonymous-session permissions.
            access.legacy = true
        }
    }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]

context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = Dummy-Driver
            node.group = pipewire.dummy
            node.sync-group = sync.dummy
            priority.driver = 200000
        }
    }
]
